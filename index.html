<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KhanhMinh Mini App</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag SDK -->
    <script
        src="//libtl.com/sdk.js"
        data-zone="11395263"
        data-sdk="show_11395263">
    </script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#1f2937;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{

            width:340px;
            background:#374151;
            border-radius:18px;
            padding:30px;
            text-align:center;

        }

        h1{

            margin-bottom:10px;

        }

        p{

            color:#ddd;
            margin-bottom:25px;

        }

        button{

            width:100%;
            padding:14px;
            font-size:18px;
            border:none;
            border-radius:12px;
            cursor:pointer;
            background:#10b981;
            color:white;

        }

        button:hover{

            opacity:.9;

        }

        #result{

            margin-top:20px;
            font-size:16px;
            color:#FFD700;

        }

    </style>

</head>

<body>

<div class="card">

<h1>🎁 KhanhMinh Mini App</h1>

<p>Xem quảng cáo để nhận thưởng.</p>

<button id="btn">
📺 Xem quảng cáo
</button>

<div id="result"></div>

</div>

<script>

Telegram.WebApp.ready();
Telegram.WebApp.expand();

const btn=document.getElementById("btn");
const result=document.getElementById("result");

btn.onclick=function(){

    result.innerHTML="⏳ Đang tải quảng cáo...";

    if(typeof show_11395263!=="function"){

        result.innerHTML="❌ SDK chưa tải.";

        return;

    }

    show_11395263()

    .then(()=>{

        result.innerHTML="✅ Xem quảng cáo thành công.";

    })

    .catch((err)=>{

        console.log(err);

        result.innerHTML="❌ Không có quảng cáo hoặc đã xảy ra lỗi.";

    });

}

</script>

</body>

</html>
